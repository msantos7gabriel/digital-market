<section class="product-page">
    <main class="product-content">
        <section class="product-information">
            <div class="product-summary">
                <div class="product-image">
                    <!-- imagem do produto -->
                </div>

                <div class="product-main-info">
                    <h1 id="product-name"> Nome do produto</h1>
                    <span id="product-category">Categoria</span>
                    <strong id="product-price">R$ 0,00</strong>

                    <div class="product-stock">
                        Em estoque:
                        <span id="product-quantity">0 Unidades</span>
                    </div>
                </div>
            </div>

            <div class="product-details">
                <div class="detail-item">
                    <span>Cód. de barras</span>
                    <span id="product-barcode">000000000000</span>
                </div>

                <div class="detail-item">
                    <span>Categoria</span>
                    <span id="detail-category">Categoria</span>
                </div>

                <div class="detail-item">
                    <span>Custo médio</span>
                    <span id="product-cost">R$ 0,00</span>
                </div>

                <div class="detail-item">
                    <span>Próx. vencimento</span>
                    <span id="product-expiration">00/00/0000</span>
                </div>

                <div class="detail-item">
                    <span>Ativo na loja</span>
                    <span id="product-active">Sim</span>
                </div>
            </div>
        </section>

        <aside class="sales-panel">
            <h2>Vendas Recentes do Produto</h2>
            <div id="recent-sales">
                <!--vendas vao ficar aqui-->
            </div>
        </aside>
    </main>
</section>
