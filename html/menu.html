<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../images/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="../css/menu.css" />
    <title>Digital Market</title>
  </head>

  <body>
    <div class="container">
      <aside class="side-bar">
        <div class="logo">
          <img src="../images/logo.png" alt="Logo do Sistema" />
        </div>

        <nav class="paginas">
          <div class="pagina">
            <a class="sidebar_pages_links is_active" href="#" data-page="inicio">
              <object class="icon" data="../icons/home_active.svg" type="image/svg+xml"></object>
              <span>Início</span>
            </a>
          </div>

          <hr />

          <div class="pagina">
            <a class="sidebar_pages_links" href="#" data-page="catalogo">
              <object class="icon" data="../icons/catalog_deactive.svg" type="image/svg+xml"></object>
              <span>Catálogo</span>
            </a>
          </div>

          <hr />

          <div class="pagina">
            <a class="sidebar_pages_links" href="#" data-page="clientes">
              <object class="icon" data="../icons/custoumers_deactive.svg" type="image/svg+xml"></object>
              <span>Clientes</span>
            </a>
          </div>
        </nav>

        <div class="opcoes">
          <div class="opcao">
            <a href="#">
              <object class="icon" data="../icons/help-circle.svg" type="image/svg+xml"></object>
              <span>Suporte</span>
            </a>
          </div>

          <div class="opcao">
            <a href="#">
              <object class="icon" data="../icons/power.svg" type="image/svg+xml"></object>
              <span>Sair</span>
            </a>
          </div>
        </div>
      </aside>

      <main id="page-content" class="page-content"></main>
    </div>

    <script src="../js/menu.js"></script>
  </body>
</html>
